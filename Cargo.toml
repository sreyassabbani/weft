[package]
name = "weft"
version = "0.1.0"
edition = "2024"
description = "A language server for Obsidian-style Markdown notes"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
ignore = "0.4"
lsp-server = "0.7"
lsp-types = "0.95"
notify = "8"
nucleo-matcher = "0.3"
percent-encoding = "2"
serde = "1"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
